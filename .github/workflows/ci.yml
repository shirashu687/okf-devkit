name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check protected and upstream changes (pull requests)
        if: github.event_name == 'pull_request'
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -c "import os, subprocess, sys; raise SystemExit(subprocess.run([sys.executable, 'harness/project/check_changes.py', '--base', os.environ['CHANGE_BASE'], '--head', os.environ['CHANGE_HEAD']]).returncode)"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: python tests/run_all.py

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      # init 直後のバンドルが lint / render を通ることを、実際のリポジトリで確認する。
      - name: init → index → lint → render
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/app/client" "$work/app/server"
          cd "$work"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          echo "export const a = 1;" > app/client/a.ts
          echo "<?php echo 1;" > app/server/api.php
          okf init --site-name "CI Smoke" \
            --layer 'client=app/client/**' \
            --layer 'server=app/server/**'
          okf index --write
          okf lint
          okf index --check
          okf render --check
          git add -A && git commit -qm "feat: initial bundle"
          okf log --write
          test -s docs/client/log.md

      - name: Hook adapter returns empty JSON without blocking
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          okf init --site-name "Hook Smoke"
          okf index --write
          test "$(sh .okf/hooks/render_hook.sh)" = "{}"
